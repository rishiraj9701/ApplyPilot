name: Build Website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'apps/website/package-lock.json'

      - name: Install Website Dependencies
        run: |
          cd apps/website
          npm ci

      - name: Typecheck and Build
        run: |
          cd apps/website
          npm run build
