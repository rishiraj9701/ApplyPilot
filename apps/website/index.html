<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>ApplyPilot — Free, Open-Source Job Application Assistant</title>
    <meta name="title" content="ApplyPilot — Free, Open-Source Job Application Assistant" />
    <meta name="description" content="Spend less time filling job applications. ApplyPilot is a free, open-source, local-first browser extension for resume intelligence, ATS autofill, and AI-assisted application answers." />
    
    <!-- Theme & Colors -->
    <meta name="theme-color" content="#090a0f" />
    <meta name="color-scheme" content="dark" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://applypilot.dev/" />
    <meta property="og:title" content="ApplyPilot — Free, Open-Source Job Application Assistant" />
    <meta property="og:description" content="Spend less time filling job applications. Local-first candidate profiles, ATS autofill, and AI-assisted answers without cloud storage or mandatory subscriptions." />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="ApplyPilot — Free, Open-Source Job Application Assistant" />
    <meta property="twitter:description" content="Spend less time filling job applications. Local-first candidate profiles, ATS autofill, and AI-assisted answers without cloud storage or mandatory subscriptions." />
    <meta property="twitter:image" content="/og-image.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Favicon (SVG) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body class="bg-[#090a0f] text-slate-100 antialiased selection:bg-emerald-500/20 selection:text-emerald-300 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
